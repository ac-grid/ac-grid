# 发布门禁：push 到 main 的 tag（v*）触发 npm 发布。
# 只发布三个公开包：@ac-grid/core、@ac-grid/theme-base、@ac-grid/theme-default。
# 用 npm trusted publishing（OIDC），不使用长期 NPM_TOKEN。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm >= 11.5.1 支持 OIDC trusted publishing；setup-node 自带的 npm 版本可能更旧。
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build publishable packages
        run: pnpm turbo run build --filter=@ac-grid/core --filter=@ac-grid/theme-base --filter=@ac-grid/theme-default

      - name: Run unit tests
        run: pnpm turbo run test --filter=@ac-grid/core --filter=@ac-grid/theme-base --filter=@ac-grid/theme-default

      # changeset publish 只发布版本号与已发布 tag 不一致的包；发布前已跑完 build + test，
      # 避免 npm 收到构建或测试失败的包。
      - name: Publish packages
        run: pnpm exec changeset publish
